name: Planner evaluation

on:
  pull_request:
    paths:
      - "src/planner/**"
      - "src/sql/**"
      - "src/evaluation/**"
      - "benchmarks/**"
      - "tests/**"
      - "pyproject.toml"
  push:
    branches: [main]

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m src.evaluation.harness --output reports/planner-evaluation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planner-evaluation
          path: reports/planner-evaluation.json
