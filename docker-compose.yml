services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pipelines
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pipelines"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/pipelines
      PIPELINE_STATE_DIR: /data/state
      EDA_REPORT_DIR: /data/reports
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pipeline_data:/data
volumes:
  postgres_data:
  pipeline_data:
